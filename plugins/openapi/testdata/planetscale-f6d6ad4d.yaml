                          display_name:
                            type: string
                            description: The display name of the parameter
                          category:
                            type: string
                            description: The category of the parameter
                          description:
                            type: string
                            description: The description of the parameter
                          immutable:
                            type: boolean
                            description: Whether the parameter can be changed
                          parameter_type:
                            type: string
                            enum:
                              - integer
