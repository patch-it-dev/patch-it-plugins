        - name: branch
          in: path
          required: true
          description: "Branch name from `list_branches`. Example: `main`."
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The dedicated read replica name
                region:
                  type: string
                  description: The region slug for the dedicated read replica
                replicas:
                  type: integer
                  description: The number of instances serving reads. Defaults to 1.
                cluster_size:
                  type: string
                  description: The cluster size SKU name. Defaults to the primary cluster size.
                storage:
                  type: object
                  properties:
                    minimum_storage_bytes:
                      type: integer
                      description: The minimum storage size in bytes.
                    maximum_storage_bytes:
                      type: integer
                      description: The maximum storage size in bytes for autoscaling.
                    storage_autoscaling:
                      type: boolean
                      description: Whether storage autoscaling is enabled.
                    storage_iops:
                      type: integer
                      description: The storage IOPS.
                    storage_throughput_mibs:
                      type: integer
                      description: The storage throughput in MiB/s.
              required:
                - name
                - region
