                      nullable: true
                    created_at:
                      type: string
                      description: When the dedicated read replica was created
                    updated_at:
                      type: string
                      description: When the dedicated read replica was last updated
                    ready_at:
                      type: string
                      description: When the dedicated read replica was ready to serve queries
                      nullable: true
                    ready:
                      type: boolean
                      description: Whether or not the dedicated read replica is ready to serve queries
                    actor:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of the actor
                        display_name:
                          type: string
                          description: The name of the actor
                        avatar_url:
                          type: string
                          description: The URL of the actor's avatar
                      required:
                        - id
                        - display_name
                        - avatar_url
                    region:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The ID of the region
                        provider:
                          type: string
                          description: Provider for the region (ex. AWS)
                        enabled:
                          type: boolean
                          description: Whether or not the region is currently active
                        public_ip_addresses:
                          items:
                            type: string
                          type: array
                          description: Public IP addresses for the region
                        display_name:
                          type: string
                          description: Name of the region
                        location:
                          type: string
                          description: Location of the region
                        slug:
                          type: string
                          description: The slug of the region
                        current_default:
                          type: boolean
                          description: True if the region is the default for new branch creation
                        mysql_supported:
                          type: boolean
                          description: Whether the region supports MySQL/Vitess databases
                        postgresql_supported:
                          type: boolean
                          description: Whether the region supports PostgreSQL databases
                        neki_supported:
                          type: boolean
                          description: Whether the region supports Neki databases
