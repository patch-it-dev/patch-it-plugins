                          options:
                            items:
                              type: string
                            type: array
                            description: Valid options for the parameter value
                          units:
                            items:
                              type: string
                            type: array
                            description: Display units for the parameter value
                          actor:
                            type: object
                            properties:
                              id:
                                type: string
                                description: The ID of the actor
                              display_name:
                                type: string
                                description: The name of the actor
