                            description: The type of the parameter
                          default_value:
                            type: string
                            description: The default value of the parameter, which is the primary's current value
                          disabled_reason:
                            type: string
                            description: Why the parameter cannot be changed
                            nullable: true
                          value:
                            type: string
                            description: The configured value of the parameter
                          required:
                            type: boolean
                            description: Whether the parameter is required
                          created_at:
                            type: string
                            description: When the parameter was created
                            nullable: true
                          updated_at:
                            type: string
                            description: When the parameter was last updated
                            nullable: true
                          restart:
                            type: boolean
