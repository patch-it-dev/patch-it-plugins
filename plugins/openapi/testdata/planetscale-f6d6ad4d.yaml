                    description: The storage type
                    nullable: true
                  storage_iops:
                    type: integer
                    description: The storage IOPS
                    nullable: true
                  storage_throughput_mibs:
                    type: integer
                    description: The storage throughput in MiB/s
                    nullable: true
                  volume_modifications_blocked_until:
