openapi: 3.0.2
info:
  title: Ingestion API
  description: >
    The Ingestion API lets you connect third-party services and platforms with
    Algolia and schedule tasks to ingest your data.

    The Ingestion API powers the no-code [data
    connectors](https://dashboard.algolia.com/connectors).


    ## Base URLs


    The base URLs for requests to the Ingestion API are:


    - `https://data.us.algolia.com`

    - `https://data.eu.algolia.com`


    Use the URL that matches your [analytics
    region](https://dashboard.algolia.com/account/infrastructure/analytics).


    **All requests must use HTTPS.**


    ## Authentication


    To authenticate your API requests, add these headers:


    - `x-algolia-application-id`. Your Algolia application ID.

    - `x-algolia-api-key`. An API key with the necessary permissions to make the
    request.
      The required access control list (ACL) to make a request is listed in each endpoint's reference.

    You can find your application ID and API key in the [Algolia
    dashboard](https://dashboard.algolia.com/account).


    ## Request format


    Request bodies must be JSON objects.


    ## Response status and errors


    Response bodies are JSON objects.

    Deleting a user token returns an empty response body with rate-limiting
    information as headers.


    Successful responses return a `2xx` status. Client errors return a `4xx`
    status. Server errors are indicated by a `5xx` status.

    Error responses have a `message` property with more information.


    The Insights API doesn't validate if the event parameters such as
    `indexName`, `objectIDs`, or `userToken`,

    correspond to anything in the Search API. It justs checks if they're
    formatted correctly.

    Check the [Events](https://dashboard.algolia.com/events/health) health
    section,

    whether your events can be used for Algolia features such as Analytics, or
    Dynamic Re-Ranking.


    ## Version


    The current version of the Insights API is version 1, as indicated by the
    `/1/` in each endpoint's URL.
  version: 1.0.0
paths:
  /1/transformations:
    get:
      tags:
        - ingestion
      summary: List transformations
      description: Retrieves a list of transformations.
      operationId: listTransformations
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      parameters:
        - $ref: '#/components/parameters/itemsPerPage'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/parameters_sort'
        - $ref: '#/components/parameters/order'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: listTransformationsResponse
                type: object
                description: Configured transformations and pagination information.
                additionalProperties: false
                properties:
                  transformations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transformation'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                required:
                  - transformations
                  - pagination
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - ingestion
      summary: Create a transformation
      description: Creates a new transformation.
      operationId: createTransformation
      requestBody:
        description: Request body for creating a transformation.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationCreate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /1/transformations/try:
    post:
      tags:
        - ingestion
      summary: Try a transformation
      description: Try a transformation before creating it.
      operationId: tryTransformation
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationTry'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationTryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /1/transformations/search:
    post:
      tags:
        - ingestion
      summary: Search for transformations
      description: Searches for transformations.
      operationId: searchTransformations
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationSearch'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: searchTransformationsResponse
                type: array
                items:
                  $ref: '#/components/schemas/Transformation'
        '400':
          $ref: '#/components/responses/BadRequest'
  /1/transformations/models:
    get:
      tags:
        - ingestion
      summary: Retrieve existing LLM transformation helpers
      description: Retrieves a list of existing LLM transformation helpers.
      operationId: listTransformationModels
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: transformationModels
                type: object
                description: List of available AI models for transformation purposes.
                additionalProperties: false
                properties:
                  llms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
                required:
                  - llms
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - ingestion
      summary: Generates code for the selected model based on the given prompt
      description: Generates code for the selected model based on the given prompt.
      operationId: generateTransformationCode
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      requestBody:
        content:
          application/json:
            schema:
              title: generateTransformationCodePayload
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                systemPrompt:
                  type: string
                userPrompt:
                  type: string
              required:
                - id
                - userPrompt
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: generateTransformationCodeResponse
                type: object
                additionalProperties: false
                properties:
                  generatedCode:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /1/transformations/{transformationID}:
    get:
      tags:
        - ingestion
      summary: Retrieve a transformation
      description: Retrieves a transformation by its ID.
      operationId: getTransformation
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      parameters:
        - $ref: '#/components/parameters/pathTransformationID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transformation'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      tags:
        - ingestion
      summary: Update a transformation
      description: Updates a transformation by its ID.
      operationId: updateTransformation
      parameters:
        - $ref: '#/components/parameters/pathTransformationID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationCreate'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      tags:
        - ingestion
      summary: Delete a transformation
      description: Deletes a transformation by its ID.
      operationId: deleteTransformation
      parameters:
        - $ref: '#/components/parameters/pathTransformationID'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /1/transformations/{transformationID}/try:
    post:
      tags:
        - ingestion
      summary: Try a transformation
      description: Try a transformation before updating it.
      operationId: tryTransformationBeforeUpdate
      x-acl:
        - addObject
        - deleteIndex
        - editSettings
      parameters:
        - $ref: '#/components/parameters/pathTransformationID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransformationTry'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformationTryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
